<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create scheme — FinTrack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">
<style>
  .create-wrap{ max-width:520px; margin:60px auto; }
  .create-head{ margin-bottom:26px; }
  .create-head h1{ font-family:var(--font-display); font-size:22px; margin-bottom:6px; }
  .create-head p{ font-size:13.5px; color:var(--text-dim); }
  .form-actions{ display:flex; gap:12px; justify-content:flex-end; margin-top:8px; }
</style>
</head>
<body>
<div class="bg-field"></div>
<div class="shell">
  <aside class="sidebar">
    <div class="brand"><span class="mark">F</span>FinTrack</div>
    <a href="admin-dashboard.html" class="side-link">← Back to overview</a>
    <div class="side-foot">
      <div class="side-link" onclick="logout()">Log out</div>
    </div>
  </aside>

  <main class="main">
    <div class="create-wrap card">
      <div class="create-head">
        <h1>Create a scheme</h1>
        <p>Set the name and initial budget. You can add members and track spend once it's created.</p>
      </div>

      <form id="schemeForm">
        <div class="field">
          <label for="sName">Scheme name</label>
          <input id="sName" type="text" placeholder="e.g. Rural School Nutrition Programme" required>
        </div>
        <div class="field">
          <label for="sBudget">Initial budget (₹)</label>
          <input id="sBudget" type="number" min="0" step="1" placeholder="e.g. 5000000" required>
        </div>
        <div class="field">
          <label>Supporting document (PDF)</label>
          <div class="dropzone" id="dz">
            <div>Click to upload, or drag a PDF here</div>
            <div class="dz-name" id="dzName"></div>
          </div>
          <input type="file" id="sFile" accept="application/pdf" style="display:none;">
          <div class="field-hint">Sanction order, approval letter, or budget breakdown — optional.</div>
        </div>
        <div class="field-error" id="formError"></div>
        <div class="form-actions">
          <a href="admin-dashboard.html" class="btn btn-ghost">Cancel</a>
          <button type="submit" class="btn btn-primary" id="createBtn">Create</button>
        </div>
      </form>
    </div>
  </main>
</div>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script>
  const user = requireAuth(['admin']);

  const dz = document.getElementById('dz');
  const fileInput = document.getElementById('sFile');
  let pickedFile = null;
  dz.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', () => {
    pickedFile = fileInput.files[0] || null;
    document.getElementById('dzName').textContent = pickedFile ? pickedFile.name : '';
  });
  ['dragover','dragleave','drop'].forEach(evt => {
    dz.addEventListener(evt, (e) => {
      e.preventDefault();
      dz.classList.toggle('drag', evt === 'dragover');
      if (evt === 'drop' && e.dataTransfer.files[0]){
        pickedFile = e.dataTransfer.files[0];
        document.getElementById('dzName').textContent = pickedFile.name;
      }
    });
  });

  document.getElementById('schemeForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = document.getElementById('sName').value.trim();
    const budget = document.getElementById('sBudget').value;
    const errEl = document.getElementById('formError');
    const btn = document.getElementById('createBtn');
    errEl.style.display = 'none';

    btn.disabled = true; btn.textContent = 'Creating…';
    try{
      const scheme = await Api.createScheme({ name, initialBudget: Number(budget) });
      if (pickedFile){
        await apiUpload(`/schemes/${scheme.id}/document`, pickedFile, {});
      }
      window.location.href = `admin-scheme-view.html?id=${scheme.id}`;
    }catch(err){
      errEl.textContent = err.message;
      errEl.style.display = 'block';
      btn.disabled = false; btn.textContent = 'Create';
    }
  });
</script>
</body>
</html>
